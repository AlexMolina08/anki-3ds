[package]
name = "anki-3ds-sqlite-probe"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

[workspace]

[dependencies]
anki-3ds-sqlite-vfs = { path = "../sqlite-vfs" }
ctru-rs = { git = "https://github.com/rust3ds/ctru-rs" }
rusqlite = { version = "=0.36.0", features = ["trace", "functions", "collation", "bundled"] }

unicase = "=2.6.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
