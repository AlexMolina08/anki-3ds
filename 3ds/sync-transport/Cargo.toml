[package]
name = "anki-3ds-sync-transport"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

[workspace]

[features]
emulator = []

[dependencies]
ammonia = "4"
anki = { path = "../../rslib", default-features = false, features = ["incremental-sync"] }
async-trait = "0.1"
http = "1"
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
tempfile = "3"
thiserror = "2.0"
tracing = "0.1"
zstd = { version = "0.13", default-features = false }

[build-dependencies]
cc = "1.2"
