[package]
name = "anki-3ds-collection-probe"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

[workspace]

[dependencies]
anki = { path = "../../rslib", default-features = false }
anki-3ds-sqlite-vfs = { path = "../sqlite-vfs" }
# Generated request/response types. rslib's service traits are generic over
# these, so the probe cannot call them without naming the crate directly.
anki_proto = { path = "../../rslib/proto" }
ctru-rs = { git = "https://github.com/rust3ds/ctru-rs" }
# Same version and feature set rslib uses, so the probe shares its sqlite3 build
# and its links are not rejected.
rusqlite = { version = "=0.36.0", features = ["trace", "functions", "collation", "bundled"] }
# Reads the FSRS memory state out of the card's data column.
serde_json = "1.0.140"

[patch.crates-io]
coarsetime = { path = "../../out/3ds/patched-deps/coarsetime" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
