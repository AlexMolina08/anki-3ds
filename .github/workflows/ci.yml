name: Port checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          rustup toolchain install nightly-2026-10-12 --profile minimal
          rustup toolchain install nightly-2025-03-20 --profile minimal --component rustfmt
      - name: Check upstream formatting and collection sync
        env:
          PROTOC_BINARY: /usr/bin/protoc
        run: |
          cargo +nightly-2025-03-20 fmt --all --check
          cargo +nightly-2026-10-12 test -p anki --lib sync::
      - name: Check native adapter logic on desktop
        env:
          PROTOC_BINARY: /usr/bin/protoc
        run: |
          python3 3ds/prepare-coarsetime.py
          cargo +nightly-2026-10-12 test --manifest-path 3ds/sync-transport/Cargo.toml --lib
          python3 3ds/testing/locales.py
