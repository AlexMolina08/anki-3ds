[package]
name = "anki"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
publish = false
rust-version.workspace = true
workspace = ".."
description = "Anki's Rust library code"

[features]
default = ["network"]
bench = ["criterion"]
# HTTP clients, sync server, and async runtime used by AnkiWeb/media sync,
# AnkiHub, update checks, and remote media fetching. Disabling default features
# builds an offline collection/scheduler library (eg for Nintendo 3DS).
incremental-sync = []
network = [
  "incremental-sync",
  "dep:async-compression",
  "dep:axum",
  "dep:axum-client-ip",
  "dep:axum-extra",
  "dep:bytes",
  "dep:futures",
  "dep:hyper",
  "dep:pin-project",
  "dep:reqwest",
  "dep:rustls-pemfile",
  "dep:tokio",
  "tokio/io-util",
  "dep:tokio-util",
  "dep:tower-http",
]
rustls = ["network", "reqwest/rustls-tls", "reqwest/rustls-tls-native-roots"]
native-tls = ["network", "reqwest/native-tls"]

[[bench]]
name = "benchmark"
harness = false
required-features = ["bench"]

[[bench]]
name = "fsrs"
harness = false
required-features = ["bench"]

[build-dependencies]
anki_io.workspace = true
anki_proto.workspace = true
anki_proto_gen.workspace = true
anyhow.workspace = true
inflections.workspace = true
itertools.workspace = true
prettyplease.workspace = true
prost.workspace = true
prost-reflect.workspace = true
syn.workspace = true

[dev-dependencies]
async-stream.workspace = true
reqwest = { workspace = true, features = ["native-tls"] }
wiremock.workspace = true

